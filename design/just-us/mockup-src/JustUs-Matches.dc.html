<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: just us, what you both want</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1320px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px 0">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; margin-left: -8px; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg><span style="display: flex; color: {{t.rose}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5.2c0 3.3 2.2 5.8 5 5.8s5-2.5 5-5.8c-1.4.9-2.7.9-3.6 0-.6-.6-1-1.5-1.4-2.7-.4 1.2-.8 2.1-1.4 2.7-.9.9-2.2.9-3.6 0z"/><path d="M9.8 6.9c.6.8 1.4 1.2 2.2 1.2s1.6-.4 2.2-1.2"/><path d="M12 11v10"/><path d="M12 16.2c-1.9-.2-3.5-1.3-4.1-3.2 2 0 3.5 1 4.1 3.2z"/><path d="M12 18.6c1.9-.2 3.5-1.3 4.1-3.2-2 0-3.5 1-4.1 3.2z"/></svg></span></div>
    <div style="margin-top: 14px; font-size: 13px; color: {{t.dim}}">To do with</div>
    <div style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 40px; line-height: 1.1; font-weight: 600">Sam</div>
  </div>
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: {{t.scrim}}"></div>
  <section role="dialog" aria-label="You both want" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; box-sizing: border-box; border-radius: 28px 28px 0 0; background: linear-gradient(180deg, {{roomTop}} 0%, {{roomSheet}} 340px); padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 20px">
    <div aria-hidden="true" style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: {{roseLine}}"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -6px">
      <a href="JustUs.dc.html" style="min-height: 44px; display: flex; align-items: center; gap: 2px; padding: 0 14px 0 8px; border-radius: 22px; background: {{roseTint}}; color: {{roseInk}}; font-size: 15px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-style: italic; font-size: 17px">Just us</span></a>
      
    </div>
    <h1 style="margin: -6px 0 0; padding: 0 4px; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 32px; line-height: 1.1; font-weight: 600; letter-spacing: -0.01em">You both want <span style="color: {{t.dim}}; font-weight: 500">{{nMatch}}</span></h1>

    <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 24px; background: linear-gradient(160deg, {{roseTint}} 0%, {{roomCard}} 75%)">
      <sc-if value="{{picked}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 2px 2px 4px">
          <span style="font-size: 13px; font-weight: 600; color: {{roseInk}}">How about</span>
          <span aria-live="polite" style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 28px; line-height: 1.15; font-weight: 600">{{pickTitle}}</span>
        </div>
      </sc-if>
      <sc-if value="{{notPicked}}" hint-placeholder-val="{{ true }}">
        <span style="padding: 2px 2px 0; font-size: 15px; line-height: 1.45; color: {{t.text2}}">Can’t choose? Let it pick one of these for you.</span>
      </sc-if>
      <button type="button" onClick="{{pick}}" style="min-height: 48px; border: 0; border-radius: 24px; background: {{t.rose}}; color: {{onRose}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15.5px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 14 4 4-4 4"></path><path d="m18 2 4 4-4 4"></path><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-7.6a4 4 0 0 1 3.3-1.7H22"></path><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"></path><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"></path></svg>{{pickLabel}}</button>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 14px; font-weight: 650; color: {{g.color}}">{{g.label}}</h2>
        <div style="border-radius: 20px; background: {{roomCard}}; overflow: hidden">
          <sc-for list="{{g.items}}" as="m" hint-placeholder-count="3">
            <div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 16px">
              <span aria-hidden="true" style="position: absolute; left: 16px; right: 0; top: 0; height: 1px; background: {{m.sep}}"></span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 19px; line-height: 1.25">{{m.title}}</span>
                <sc-if value="{{m.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: {{t.dim}}">{{m.sub}}</span></sc-if>
              </span>
              <sc-if value="{{m.isNew}}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 8px; border-radius: 9px; background: {{t.rose}}; color: {{onRose}}; font-size: 11.5px; font-weight: 750">New</span></sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <section aria-label="Your own" style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; padding: 0 4px; font-size: 14px; font-weight: 650; color: {{t.text2}}">Ask your own</h2>
      <div style="display: flex; gap: 8px">
        <label for="juOwn" class="sr">Something you’d like to try</label>
        <input id="juOwn" type="text" maxlength="80" placeholder="Something you’d like to try" autocomplete="off" style="flex: 1; min-width: 0; box-sizing: border-box; min-height: 50px; border: 0; border-radius: 16px; background: {{roomCard}}; color: {{t.text}}; padding: 0 16px; font-size: 16px; outline: none" />
        <button type="button" aria-label="Ask" style="width: 50px; height: 50px; flex-shrink: 0; border: 0; border-radius: 25px; background: {{roseTint}}; color: {{roseInk}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
      <p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 1.5; color: {{t.dim}}">Sam sees the question, not who asked it. It shows up here only if you both lean yes, and only you can take it back.</p>
    </section>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 1320}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7),
      glass: rgba(mix(bg, card, 0.5), 0.86),
      mapLand: toHex(mix(bg, card, 0.6)),
      mapWater: toHex(mix(bg, [70, 118, 160], 0.3)),
      mapPark: toHex(mix(mix(bg, card, 0.6), sage, 0.13)),
      mapRoad: toHex(mix(bg, ink, 0.1)),
      mapMajor: toHex(mix(bg, ink, 0.18)),
      mapLabel: toHex(mix(bg, ink, 0.5))
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  hx(h) { h = String(h).replace('#', ''); var n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  hex(c) { return '#' + c.map(function (v) { v = Math.round(Math.max(0, Math.min(255, v))).toString(16); return v.length < 2 ? '0' + v : v; }).join('').toUpperCase(); }
  mixc(a, b, w) { var x = this.hx(a), y = this.hx(b); return this.hex([x[0] + (y[0] - x[0]) * w, x[1] + (y[1] - x[1]) * w, x[2] + (y[2] - x[2]) * w]); }
  rgba(h, a) { var c = this.hx(h); return 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + a + ')'; }
  room() {
    var t = this.theme(this.props.theme ?? 'dusk');
    var cool = this.mixc(t.faint, '#8C9AD0', 0.45);
    var self = this;
    var W = { no: 0, soft: 0.2, maybe: 0.5, yes: 0.78, love: 1 };
    return {
      t: t, cool: cool,
      roseTint: this.rgba(t.rose, 0.16), roseLine: this.rgba(t.rose, 0.4), roseInk: this.mixc(t.rose, t.text, 0.25),
      roomTop: this.mixc(t.sheet, t.rose, 0.12), roomSheet: this.mixc(t.sheet, t.rose, 0.04),
      roomCard: this.mixc(t.surface, t.rose, 0.07), onRose: this.mixc(t.bg, '#000000', 0.35),
      W: W,
      warm: function (w) { return self.mixc(cool, t.rose, Math.max(0, Math.min(1, w))); }
    };
  }
  levels() {
    return [['no', 'No'], ['soft', 'Soft no'], ['maybe', 'Maybe'], ['yes', 'Yes'], ['love', 'Yes, please']];
  }

  renderVals() {
    var self = this;
    var r = this.room();
    var t = r.t;
    var st = this.state || {};
    var W = r.W;
    // [title, mine, theirs, new]: made up, for a stand-in partner.
    var M = [
      ['Very slow, all evening', 'love', 'love', true], ['A massage with oil', 'love', 'love', false],
      ['Showering together', 'yes', 'yes', true], ['Lingerie', 'yes', 'love', false], ['Blindfolds', 'love', 'yes', false],
      ['Sexting during the day', 'yes', 'yes', false],
      ['Role play', 'maybe', 'yes', false], ['In front of a mirror', 'yes', 'maybe', false], ['Ice or warm wax', 'maybe', 'maybe', false]
    ];
    function band(m) { var a = W[m[1]], b = W[m[2]]; return Math.min(a, b) >= 1 ? 0 : Math.min(a, b) >= 0.78 ? 1 : 2; }
    var heads = [['You both said “yes, please”', t.rose], ['You both said yes', r.roseInk], ['One of you said maybe', t.text2]];
    var groups = heads.map(function (h, gi) {
      var items = M.filter(function (m) { return band(m) === gi; }).map(function (m, i) {
        var sub = gi < 2 ? '' : (m[1] === 'maybe' && m[2] === 'maybe' ? 'Both of you: maybe' : (m[1] === 'maybe' ? 'You: maybe' : 'Sam: maybe'));
        return { title: m[0], isNew: m[3], sep: i ? t.line : 'transparent', a: r.warm(W[m[1]]), b: r.warm(W[m[2]]), sub: sub, hasSub: !!sub };
      });
      return { label: h[0] + ' · ' + items.length, color: h[1], items: items };
    });
    var p = st.p;
    return Object.assign(r, {
      nMatch: M.length, groups: groups,
      picked: p != null, notPicked: p == null, pickTitle: p != null ? M[p][0] : '',
      pickLabel: p != null ? 'Another' : 'Pick one for us',
      pick: function () { var n = Math.floor(Math.random() * M.length); if (n === p) n = (n + 1) % M.length; self.setState({ p: n }); }
    });
  }
}
</script>
</body>
</html>
