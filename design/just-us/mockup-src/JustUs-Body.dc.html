      };
    });
    var views = [seg('together', 'Together', view, 'view'), seg('mine', 'Yours', view, 'view'), seg('theirs', 'Sam’s', view, 'view')];
    return Object.assign(r, {
      fig: this.mixc(r.roomSheet, t.text, 0.12),
      figLabel: 'A figure, ' + side + '. Tap a place to answer.',
      pts: pts, views: views, viewsN: 3,
      sides: [seg('front', 'Front', side, 'side'), seg('back', 'Back', side, 'side')],
      partLabel: labels[part], rows: rows
    });
  }
}
</script>
