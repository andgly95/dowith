<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: kitchen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1330px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 16px; padding: 6px 16px 28px">
    <div style="display: flex; align-items: center; height: 44px; margin-left: -8px">
      <a href="Recipes.dc.html" aria-label="Back to recipes" style="width: 44px; height: 44px; border-radius: 22px; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px">
      <h1 style="margin: 0; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em">Kitchen</h1>
      <div role="group" aria-label="Whose kitchen" style="display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: {{t.surface}}">
        <sc-for list="{{kitchens}}" as="k" hint-placeholder-count="2">
          <button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="min-height: 36px; border: 0; border-radius: 11px; background: {{k.bg}}; color: {{k.fg}}; padding: 0 12px; font-size: 13.5px; font-weight: 600">{{k.label}}</button>
        </sc-for>
      </div>
    </div>
    <div role="tablist" aria-label="Pantry or list" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 16px; background: {{t.surface}}">
      <sc-for list="{{tabs}}" as="b" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{b.pressed}}" onClick="{{b.pick}}" style="min-height: 44px; border: 0; border-radius: 12px; background: {{b.bg}}; color: {{b.fg}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; font-weight: 600">{{b.label}}<span style="font-weight: 500; opacity: 0.7">{{b.n}}</span></button>
      </sc-for>
    </div>

    <sc-if value="{{showPantry}}" hint-placeholder-val="{{ true }}">
      <div style="position: relative">
        <span aria-hidden="true" style="position: absolute; left: 14px; top: 15px; color: {{t.dim}}; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
        <label for="pnAdd" class="sr">Add to the pantry</label>
        <input id="pnAdd" type="text" placeholder="Add to the pantry…" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 16px; background: {{t.surface}}; color: {{t.text}}; padding: 0 16px 0 44px; font-size: 16px; outline: none" />
      </div>
      <sc-for list="{{groups}}" as="grp" hint-placeholder-count="4">
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; padding: 0 4px; font-size: 14px; font-weight: 600; color: {{t.text2}}">{{grp.name}}</h2>
          <div style="background: {{t.surface}}; border-radius: 18px; overflow: hidden">
            <sc-for list="{{grp.items}}" as="it" hint-placeholder-count="4">
              <div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 6px 0 16px">
                <div aria-hidden="true" style="position: absolute; left: 16px; right: 0; top: 0; height: 1px; background: {{it.sep}}"></div>
                <span style="flex: 1; font-size: 16px">{{it.name}}</span>
                <button type="button" aria-label="{{it.aria}}" onClick="{{it.cycle}}" style="min-width: 72px; min-height: 40px; border: 0; border-radius: 20px; background: {{it.bg}}; color: {{it.fg}}; padding: 0 12px; font-size: 13.5px; font-weight: 600">{{it.state}}</button>
              </div>
            </sc-for>
          </div>
        </section>
      </sc-for>
      <p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 1.45; color: {{t.dim}}">Tap to cycle: Have, Low, Out. Out goes on the list to buy. Recipes check against whichever kitchen you’re cooking in.</p>
    </sc-if>

    <sc-if value="{{showList}}" hint-placeholder-val="{{ false }}">
      <button type="button" style="min-height: 48px; border: 0; border-radius: 16px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5v6a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"></path><path d="M16 7l-4-4-4 4M12 3v12.5"></path></svg>Send the list</button>
      <sc-for list="{{buy}}" as="grp" hint-placeholder-count="2">
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0; padding: 0 4px; font-size: 14px; font-weight: 600; color: {{t.text2}}">{{grp.name}}</h2>
          <div style="background: {{t.surface}}; border-radius: 18px; overflow: hidden">
            <sc-for list="{{grp.items}}" as="it" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{it.pressed}}" onClick="{{it.toggle}}" style="position: relative; width: 100%; min-height: 56px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 14px; text-align: left">
                <span aria-hidden="true" style="position: absolute; left: 52px; right: 0; top: 0; height: 1px; background: {{it.sep}}"></span>
                <span aria-hidden="true" style="width: 26px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; border: 1.75px solid {{it.ring}}; background: {{it.fill}}; color: {{t.onSage}}; display: flex; align-items: center; justify-content: center"><span style="display: flex; opacity: {{it.check}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.4l4.3 4.3L18.6 7.6"></path></svg></span></span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; color: {{it.color}}; text-decoration: {{it.deco}}">{{it.name}}</span><span style="font-size: 13px; color: {{t.dim}}">{{it.sub}}</span></span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-for>
      <p style="margin: 0; padding: 0 4px; font-size: 13px; line-height: 1.45; color: {{t.dim}}">Tick it when it’s in the bag. Ticked things move into the pantry.</p>
    </sc-if>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 1330}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7),
      glass: rgba(mix(bg, card, 0.5), 0.86),
      mapLand: toHex(mix(bg, card, 0.6)),
      mapWater: toHex(mix(bg, [70, 118, 160], 0.3)),
      mapPark: toHex(mix(mix(bg, card, 0.6), sage, 0.13)),
      mapRoad: toHex(mix(bg, ink, 0.1)),
      mapMajor: toHex(mix(bg, ink, 0.18)),
      mapLabel: toHex(mix(bg, ink, 0.5))
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  renderVals() {
    var self = this;
    var t = this.theme(this.props.theme ?? 'dusk');
    var st = this.state || {};
    var tab = st.tab || 'pantry';
    var kitchen = st.kitchen || 'mine';
    var S0 = { mine: { 'Eggs': 'low' }, hers: { 'Chicken thighs': 'out', 'Chicken broth': 'out', 'Red pepper flakes': 'out', 'Butter': 'low' } };
    var all = st.states || S0;
    var states = all[kitchen] || {};
    var got = st.got || {};
    var G = [
      ['Produce', ['Garlic', 'Yellow onions', 'Lemons', 'Fresh basil']],
      ['Fridge and freezer', ['Chicken thighs', 'Butter', 'Eggs']],
      ['Cupboard', ['Olive oil', 'All-purpose flour', 'Arborio rice', 'Chicken broth', 'Canned tomatoes']],
      ['Spices', ['Salt', 'Black pepper', 'Red pepper flakes', 'Dried thyme']]
    ];
    var LAB = { have: 'Have', low: 'Low', out: 'Out' };
    var NEXT = { have: 'low', low: 'out', out: 'have' };
    var nOut = 0;
    var groups = G.map(function (g) {
      return { name: g[0], items: g[1].map(function (n, i) {
        var s = states[n] || 'have';
        if (s === 'out') nOut++;
        return { name: n, state: LAB[s], sep: i === 0 ? 'transparent' : t.line,
          bg: s === 'have' ? 'transparent' : (s === 'low' ? t.accentTint : t.raised),
          fg: s === 'have' ? t.dim : (s === 'low' ? t.accent : t.text),
          aria: n + ': ' + LAB[s] + '. Tap to change.',
          cycle: function () { var o = Object.assign({}, states); o[n] = NEXT[s]; var a = Object.assign({}, all); a[kitchen] = o; self.setState({ states: a }); } };
      }) };
    });
    var forRecipe = kitchen === 'mine'
      ? [['Heavy cream', '¾ cup'], ['Grated parmesan', '½ cup'], ['Sun-dried tomatoes', '½ cup']]
      : [['Chicken thighs', '1½ lb'], ['Chicken broth', '1 cup'], ['Red pepper flakes', '½ tsp']];
    var taken = {};
    forRecipe.forEach(function (x) { taken[x[0]] = 1; });
    var running = [];
    G.forEach(function (g) { g[1].forEach(function (n) { var s = states[n]; if ((s === 'low' || s === 'out') && !taken[n]) running.push([n, s === 'out' ? 'out, from the pantry' : 'low, from the pantry']); }); });
    var B = [['For Marry Me Chicken', forRecipe]];
    if (running.length) B.push(['Running low', running]);
    var buy = B.map(function (g) {
      return { name: g[0], items: g[1].map(function (x, i) {
        var on = !!got[x[0]];
        return { name: x[0], sub: x[1], pressed: on ? 'true' : 'false', sep: i === 0 ? 'transparent' : t.line,
          ring: on ? t.sage : t.dim, fill: on ? t.sage : 'transparent', check: on ? 1 : 0,
          color: on ? t.dim : t.text, deco: on ? 'line-through' : 'none',
          toggle: function () { var o = Object.assign({}, got); o[x[0]] = !o[x[0]]; self.setState({ got: o }); } };
      }) };
    });
    function seg(id, label, n) { var on = tab === id; return { label: label, n: n, pressed: on ? 'true' : 'false', bg: on ? t.raised : 'transparent', fg: on ? t.text : t.dim, pick: function () { self.setState({ tab: id }); } }; }
    function k(id, label) { var on = kitchen === id; return { label: label, pressed: on ? 'true' : 'false', bg: on ? t.raised : 'transparent', fg: on ? t.text : t.dim, pick: function () { self.setState({ kitchen: id }); } }; }
    return {
      t: t,
      kitchens: [k('mine', 'Mine'), k('hers', 'Linnea’s')],
      tabs: [seg('pantry', 'Pantry', 16), seg('list', 'To buy', forRecipe.length + running.length)],
      showPantry: tab === 'pantry', showList: tab === 'list',
      groups: groups, buy: buy
    };
  }
}
</script>
</body>
</html>
