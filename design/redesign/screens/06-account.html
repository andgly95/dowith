<style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #17131A; color: #F4EEE9; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">

        <div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px">

        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

            </button>
          
            <button type="button" aria-pressed="false" style="border: 0; border-radius: 16px; background: transparent; box-shadow: inset 0 0 0 1px #332B3A; padding: 6px; display: flex; flex-direction: column; gap: 8px; text-align: left">

                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 6px; background: #213027"></span><span style="width: 44px; height: 6px; border-radius: 3px; background: #C6D1C4"></span></span>
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 6px; background: #213027"></span><span style="width: 30px; height: 6px; border-radius: 3px; background: #C6D1C4"></span></span>

        <span aria-hidden="true" style="display: flex; width: 28px; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3" /><path d="M15.5 16.5L20 12l-4.5-4.5M20 12H9.5" /></svg></span>Sign out
