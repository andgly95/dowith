<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: your lists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 18px; padding: 14px 16px 32px">
    <header style="display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 4px; min-height: 56px">
      <h1 style="margin: 0; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em">Do With</h1>
      <a href="Profile.dc.html" aria-label="Account" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center">
        <span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.raised}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">A</span>
      </a>
    </header>

    <a href="Main.dc.html" style="display: flex; flex-direction: column; gap: 14px; background: {{t.surface}}; border-radius: 22px; padding: 16px 16px 12px">
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: {{t.raised}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 600">L</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 23px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">Linnea</span>
          <span style="font-size: 14px; color: {{t.dim}}"><span style="color: {{t.accent}}; font-weight: 600">28</span> to do · <span style="color: {{t.sage}}; font-weight: 600">18</span> done together</span>
        </div>
        <span style="color: {{t.dim}}; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; border-top: 1px solid {{t.line}}; padding-top: 10px"><span aria-label="5 activities" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; color: {{t.dim}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.7 5.1a2 2 0 0 0 1.3 1.3l5.1 1.7-5.1 1.7a2 2 0 0 0-1.3 1.3L12 19.8l-1.7-5.2a2 2 0 0 0-1.3-1.3L3.9 11.6l5.1-1.7a2 2 0 0 0 1.3-1.3z"></path></svg><span style="font-size: 14px; font-weight: 600; color: {{t.text2}}; font-variant-numeric: tabular-nums">5</span></span><span aria-label="8 films" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; color: {{t.dim}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="4.8" width="17.6" height="14.4" rx="2.4"></rect><path d="M7.4 4.8v14.4M16.6 4.8v14.4"></path><g fill="currentColor" stroke="none"><rect x="4.6" y="7.4" width="1.6" height="1.6" rx=".4"></rect><rect x="4.6" y="11.2" width="1.6" height="1.6" rx=".4"></rect><rect x="4.6" y="15" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="7.4" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="11.2" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="15" width="1.6" height="1.6" rx=".4"></rect></g></svg><span style="font-size: 14px; font-weight: 600; color: {{t.text2}}; font-variant-numeric: tabular-nums">8</span></span><span aria-label="5 shows" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; color: {{t.dim}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="7.6" width="17.6" height="11.6" rx="2.4"></rect><path d="M8.4 3.6L12 7.6l3.6-4"></path></svg><span style="font-size: 14px; font-weight: 600; color: {{t.text2}}; font-variant-numeric: tabular-nums">5</span></span><span aria-label="6 places" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; color: {{t.dim}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.8s6.6-5.4 6.6-10.1a6.6 6.6 0 1 0-13.2 0C5.4 15.4 12 20.8 12 20.8z"></path><circle cx="12" cy="10.5" r="2.4"></circle></svg><span style="font-size: 14px; font-weight: 600; color: {{t.text2}}; font-variant-numeric: tabular-nums">6</span></span><span aria-label="4 recipes" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 32px; color: {{t.dim}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 10.2h15.2v4.6a4 4 0 0 1-4 4H8.4a4 4 0 0 1-4-4z"></path><path d="M2.9 10.2h18.2"></path><path d="M9 7.4c0-1.1 1-1.5 1-2.6M12.6 7.4c0-1.1 1-1.5 1-2.6"></path></svg><span style="font-size: 14px; font-weight: 600; color: {{t.text2}}; font-variant-numeric: tabular-nums">4</span></span></div>
    </a>

    <button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 72px; border: 0; border-radius: 22px; background: transparent; box-shadow: inset 0 0 0 1.5px {{t.line}}; padding: 12px 16px; text-align: left">
      <span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{t.accentTint}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600; color: {{t.text}}">Start a new list</span>
        <span style="font-size: 13.5px; color: {{t.dim}}">With one person, or a group with a name</span>
      </span>
    </button>

    <p style="margin: auto 0 0; padding: 0 28px; text-align: center; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-style: italic; font-size: 16px; line-height: 1.6; color: {{t.dim}}">The things you keep meaning to do with the people you keep meaning to do them with.</p>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7)
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  renderVals() {
    return { t: this.theme(this.props.theme ?? 'dusk') };
  }
}
</script>
</body>
</html>
