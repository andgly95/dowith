<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
    <div aria-hidden="true" style="padding: 22px 20px 0">
      <span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em">Do With</span>
      <div style="margin-top: 22px; height: 128px; border-radius: 22px; background: {{t.surface}}"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: {{t.scrim}}"></div>
    <section role="dialog" aria-label="Account" style="position: absolute; left: 0; right: 0; bottom: 0; top: 112px; box-sizing: border-box; background: {{t.sheet}}; border-radius: 26px 26px 0 0; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 16px">
      <div aria-hidden="true" style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: {{t.faint}}"></div>
      <div style="display: flex; align-items: center; gap: 14px; padding-left: 4px">
        <span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 28px; background: {{t.raised}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">A</span>
        <h2 style="flex: 1; margin: 0; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">Andrew</h2>
        <a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{t.raised}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
      </div>

      <div style="background: {{t.surface}}; border-radius: 18px; overflow: hidden">
        <div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px">
          
          <span aria-hidden="true" style="color: {{t.dim}}; display: flex; width: 28px; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"></circle><path d="M4.5 20.5c.8-4 3.8-6.3 7.5-6.3s6.7 2.3 7.5 6.3"></path></svg></span>
          <span style="flex: 1; font-size: 15.5px; color: {{t.text}}">People you can share with</span>
          <span style="font-size: 15.5px; font-weight: 500; color: {{t.text}}">1</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 16px">
          <div aria-hidden="true" style="position: absolute; left: 56px; right: 0; top: 0; height: 1px; background: {{t.line}}"></div>
          <span aria-hidden="true" style="color: {{t.dim}}; display: flex; width: 28px; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><rect x="9" y="9" width="6" height="6" rx="1.5"></rect></svg></span>
          <span style="flex: 1; font-size: 15.5px; color: {{t.text}}">The Square</span>
          <span style="font-size: 15.5px; font-weight: 500; color: {{t.dim}}">Not connected</span>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; background: {{t.surface}}; border-radius: 18px; padding: 8px 12px 8px 16px">
        <span aria-hidden="true" style="color: {{t.dim}}; display: flex; width: 28px; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6.5 2.5 8 2.5 8h-17S6 15.5 6 9z"></path><path d="M10.3 20.5a1.9 1.9 0 0 0 3.4 0"></path></svg></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15.5px; font-weight: 600">Nudges</span>
          <span style="font-size: 13px; line-height: 1.35; color: {{t.dim}}">On for this device, plus a roundup on Sundays</span>
        </span>
        <button type="button" role="switch" aria-checked="{{nudge}}" aria-label="Nudges" onClick="{{toggleNudge}}" style="width: 52px; height: 44px; flex-shrink: 0; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
          <span style="position: relative; width: 50px; height: 30px; border-radius: 15px; background: {{track}}; display: block">
            <span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 24px; height: 24px; border-radius: 12px; background: {{knob}}; display: block"></span>
          </span>
        </button>
      </div>

      <div role="group" aria-label="Theme, on this device" style="display: flex; flex-direction: column; gap: 10px; background: {{t.surface}}; border-radius: 18px; padding: 14px 14px 14px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 2px">
          <span style="font-size: 15.5px; font-weight: 600">Theme</span>
          <span style="font-size: 13px; color: {{t.dim}}">on this device</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{themes}}" as="o" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="border: 0; border-radius: 16px; background: transparent; box-shadow: {{o.ring}}; padding: 6px; display: flex; flex-direction: column; gap: 8px; text-align: left">
              <span aria-hidden="true" style="height: 74px; border-radius: 11px; background: {{o.bg}}; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 7px">
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 6px; background: {{o.card}}"></span><span style="width: 44px; height: 6px; border-radius: 3px; background: {{o.ink}}"></span></span>
                <span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 18px; border-radius: 6px; background: {{o.card}}"></span><span style="width: 30px; height: 6px; border-radius: 3px; background: {{o.ink}}"></span></span>
                <span style="display: flex; gap: 5px; margin-top: auto"><span style="width: 22px; height: 8px; border-radius: 4px; background: {{o.accent}}"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: {{o.sage}}"></span></span>
              </span>
              <span style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 2px; font-size: 14.5px; font-weight: 600; color: {{t.text}}">{{o.name}}<span style="display: flex; color: {{t.accent}}; opacity: {{o.checkOpacity}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.4l4.3 4.3L18.6 7.6"></path></svg></span></span>
            </button>
          </sc-for>
        </div>
      </div>

      <button type="button" style="min-height: 54px; border: 0; border-radius: 18px; background: {{t.surface}}; color: {{t.warn}}; display: flex; align-items: center; gap: 12px; padding: 0 16px; font-size: 15.5px; font-weight: 500; text-align: left">
        <span aria-hidden="true" style="display: flex; width: 28px; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3"></path><path d="M15.5 16.5L20 12l-4.5-4.5M20 12H9.5"></path></svg></span>Sign out
      </button>
    </section>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7)
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  renderVals() {
    var self = this;
    var st = this.state || {};
    var key = st.theme || (this.props.theme ?? 'dusk');
    var t = this.theme(key);
    var on = st.nudge != null ? st.nudge : true;
    var OPTS = [
      { id: 'dusk', name: 'Dusk', bg: '#17131A', card: '#2B2430', ink: '#CBBFC6', accent: '#F2845C', sage: '#8FB9A8' },
      { id: 'forest', name: 'Forest', bg: '#111A15', card: '#213027', ink: '#C6D1C4', accent: '#E8A658', sage: '#93CFA0' }
    ];
    return {
      t: t,
      nudge: on ? 'true' : 'false',
      toggleNudge: function () { self.setState({ nudge: !on }); },
      track: on ? t.accent : t.raised, knob: on ? t.onAccent : t.text2, knobLeft: on ? '23px' : '3px',
      themes: OPTS.map(function (o) {
        var sel = o.id === t.key;
        return { name: o.name, bg: o.bg, card: o.card, ink: o.ink, accent: o.accent, sage: o.sage,
          pressed: sel ? 'true' : 'false', checkOpacity: sel ? 1 : 0,
          ring: sel ? 'inset 0 0 0 2px ' + t.accent : 'inset 0 0 0 1px ' + t.line,
          pick: function () { self.setState({ theme: o.id }); } };
      })
    };
  }
}
</script>
</body>
</html>
