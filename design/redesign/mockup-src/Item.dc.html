<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: one item, opened</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1090px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
    <div aria-hidden="true" style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 500; color: {{t.dim}}">To do with</span>
      <span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 34px; line-height: 1.12; font-weight: 600">Linnea</span>
    </div>
    <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: {{t.scrim}}"></div>
    <section role="dialog" aria-label="Fishing" style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; box-sizing: border-box; background: {{t.sheet}}; border-radius: 26px 26px 0 0; padding: 8px 16px 28px; display: flex; flex-direction: column; gap: 18px">
      <div aria-hidden="true" style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: {{t.faint}}"></div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 0 0 0 4px">
        <span aria-hidden="true" style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 16px; background: {{t.raised}}; display: flex; align-items: center; justify-content: center; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif; font-size: 30px; line-height: 1">{{emoji}}</span>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 25px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">{{rest}}</span>
          <span style="font-size: 13.5px; color: {{t.dim}}">Your idea · Activity</span>
        </div>
        <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{t.raised}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="isName" style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">What</label>
        <input id="isName" type="text" value="{{title}}" onChange="{{onTitle}}" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; outline: none; padding: 0 16px" />
      </div>

      <div role="group" aria-label="What kind" style="display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">What kind</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="true" style="min-height: 40px; border: 0; border-radius: 20px; background: {{t.accentTint}}; color: {{t.accent}}; padding: 0 13px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.7 5.1a2 2 0 0 0 1.3 1.3l5.1 1.7-5.1 1.7a2 2 0 0 0-1.3 1.3L12 19.8l-1.7-5.2a2 2 0 0 0-1.3-1.3L3.9 11.6l5.1-1.7a2 2 0 0 0 1.3-1.3z"></path></svg>Activity</button><button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 20px; background: {{t.surface}}; color: {{t.text2}}; padding: 0 13px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="4.8" width="17.6" height="14.4" rx="2.4"></rect><path d="M7.4 4.8v14.4M16.6 4.8v14.4"></path><g fill="currentColor" stroke="none"><rect x="4.6" y="7.4" width="1.6" height="1.6" rx=".4"></rect><rect x="4.6" y="11.2" width="1.6" height="1.6" rx=".4"></rect><rect x="4.6" y="15" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="7.4" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="11.2" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="15" width="1.6" height="1.6" rx=".4"></rect></g></svg>Film</button><button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 20px; background: {{t.surface}}; color: {{t.text2}}; padding: 0 13px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="7.6" width="17.6" height="11.6" rx="2.4"></rect><path d="M8.4 3.6L12 7.6l3.6-4"></path></svg>Show</button><button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 20px; background: {{t.surface}}; color: {{t.text2}}; padding: 0 13px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.8s6.6-5.4 6.6-10.1a6.6 6.6 0 1 0-13.2 0C5.4 15.4 12 20.8 12 20.8z"></path><circle cx="12" cy="10.5" r="2.4"></circle></svg>Place</button><button type="button" aria-pressed="false" style="min-height: 40px; border: 0; border-radius: 20px; background: {{t.surface}}; color: {{t.text2}}; padding: 0 13px 0 10px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 10.2h15.2v4.6a4 4 0 0 1-4 4H8.4a4 4 0 0 1-4-4z"></path><path d="M2.9 10.2h18.2"></path><path d="M9 7.4c0-1.1 1-1.5 1-2.6M12.6 7.4c0-1.1 1-1.5 1-2.6"></path></svg>Recipe</button></div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">When<span style="font-weight: 500; color: {{t.dim}}">optional</span></span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button type="button" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; outline: none; padding: 0 14px; display: flex; align-items: center; gap: 10px; color: {{t.dim}}; font-size: 15.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5"></rect><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"></path></svg>Pick a day</button>
          <button type="button" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; outline: none; padding: 0 14px; display: flex; align-items: center; gap: 10px; color: {{t.dim}}; font-size: 15.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Time</button>
        </div>
        <span style="padding: 0 4px; font-size: 12.5px; line-height: 1.4; color: {{t.dim}}">Linnea can put it on a day too. Saves as soon as you pick.</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="isPlace" style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">Where<span style="font-weight: 500; color: {{t.dim}}">optional</span></label>
        <div style="position: relative">
          <span aria-hidden="true" style="position: absolute; left: 14px; top: 15px; color: {{t.dim}}; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.8s6.6-5.4 6.6-10.1a6.6 6.6 0 1 0-13.2 0C5.4 15.4 12 20.8 12 20.8z"></path><circle cx="12" cy="10.5" r="2.4"></circle></svg></span>
          <input id="isPlace" type="text" placeholder="that ramen bar in Adams Morgan" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; outline: none; padding: 0 16px 0 44px" />
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="isLink" style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">Link<span style="font-weight: 500; color: {{t.dim}}">optional</span></label>
        <div style="position: relative">
          <span aria-hidden="true" style="position: absolute; left: 14px; top: 15px; color: {{t.dim}}; display: flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13.5a4.5 4.5 0 0 0 6.4.4l2.8-2.8a4.5 4.5 0 0 0-6.4-6.4l-1.4 1.4"></path><path d="M14 10.5a4.5 4.5 0 0 0-6.4-.4l-2.8 2.8a4.5 4.5 0 0 0 6.4 6.4l1.4-1.4"></path></svg></span>
          <input id="isLink" type="url" placeholder="https://" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; outline: none; padding: 0 16px 0 44px" />
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="isNotes" style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">Notes<span style="font-weight: 500; color: {{t.dim}}">optional</span></label>
        <textarea id="isNotes" rows="3" style="box-sizing: border-box; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: {{t.surface}}; color: {{t.text}}; font-size: 16px; outline: none; padding: 13px 16px; resize: none; line-height: 1.45"></textarea>
      </div>

      <div role="group" aria-label="Who sees it" style="display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px; font-size: 13.5px; font-weight: 600; color: {{t.text2}}">Who sees it</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: {{t.surface}}; border-radius: 16px; padding: 4px">
          <sc-for list="{{visOpts}}" as="v" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="min-height: 44px; border: 0; border-radius: 12px; background: {{v.bg}}; color: {{v.fg}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 600">
              <sc-if value="{{v.isPrivate}}" hint-placeholder-val="{{ false }}"><span style="display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg></span></sc-if>
              <sc-if value="{{v.isShared}}" hint-placeholder-val="{{ true }}"><span style="display: flex"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"></circle><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5"></path><path d="M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.8 14.8c2 .7 3.3 2.5 3.7 5.2"></path></svg></span></sc-if>
              <sc-if value="{{v.isPublic}}" hint-placeholder-val="{{ false }}"><span style="display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg></span></sc-if>
              {{v.label}}
            </button>
          </sc-for>
        </div>
        <span style="padding: 0 4px; font-size: 12.5px; line-height: 1.4; color: {{t.dim}}">{{visHint}}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px">
        <a href="Main.dc.html" style="min-height: 52px; border-radius: 16px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Save</a>
        <button type="button" style="min-height: 48px; border: 0; background: transparent; color: {{t.warn}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l.9 12a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4L17.5 7"></path></svg>Delete</button>
      </div>
    </section>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 1090}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7)
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  renderVals() {
    var self = this;
    var t = this.theme(this.props.theme ?? 'dusk');
    var st = this.state || {};
    var title = st.title != null ? st.title : '🎣 Fishing';
    var s = this.lead(title);
    var vis = st.vis || 'shared';
    var VIS = [
      { id: 'private', label: 'Just me', hint: 'Only you. Not even Linnea sees it.' },
      { id: 'shared', label: 'Us', hint: 'You and Linnea.' },
      { id: 'public', label: 'Anyone', hint: 'Shows up in every list you keep, as a standing wish.' }
    ];
    var cur = VIS.filter(function (v) { return v.id === vis; })[0];
    return {
      t: t, title: title, emoji: s.emoji || '✦', rest: s.rest || 'Untitled',
      onTitle: function (e) { self.setState({ title: e.target.value }); },
      visHint: cur.hint,
      visOpts: VIS.map(function (v) {
        var on = v.id === vis;
        return { label: v.label, pressed: on ? 'true' : 'false', isPrivate: v.id === 'private', isShared: v.id === 'shared', isPublic: v.id === 'public',
          bg: on ? t.raised : 'transparent', fg: on ? t.text : t.dim,
          pick: function () { self.setState({ vis: v.id }); } };
      })
    };
  }
}
</script>
</body>
</html>
