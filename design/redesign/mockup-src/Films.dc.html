<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: Films</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>

a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">
    
    <header style="flex-shrink: 0; display: flex; flex-direction: column; padding: 6px 8px 0">

        <a href="Home.dc.html" aria-label="All lists" style="width: 44px; height: 44px; border-radius: 22px; color: {{t.text}}; display: flex; align-items: center; justify-content: center">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </a>
        <button type="button" aria-label="Just us" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: {{t.dim}}; display: flex; align-items: center; justify-content: center; padding: 0">

        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 2px 12px 0">
        <span style="font-size: 13px; font-weight: 500; color: {{t.dim}}">To do with</span>
        <button type="button" aria-label="Linnea, list settings" style="align-self: flex-start; border: 0; background: transparent; padding: 0; display: flex; align-items: center; gap: 6px; color: {{t.text}}">
          <span style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 34px; line-height: 1.12; font-weight: 600; letter-spacing: -0.02em">Linnea</span>
          <span style="color: {{t.dim}}; display: flex; margin-top: 6px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
        </button>

                <sc-if value="{{f.done}}" hint-placeholder-val="{{ false }}">

                </sc-if>
                <button type="button" aria-label="{{f.label}}" aria-pressed="{{f.pressed}}" onClick="{{f.toggle}}" style="position: absolute; right: 0; bottom: 0; width: 48px; height: 48px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
                  <span style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 1.75px solid {{f.ringBorder}}; background: {{f.ringBg}}; color: {{f.checkColor}}; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px)">
                    <span style="display: flex; opacity: {{f.checkOpacity}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.4l4.3 4.3L18.6 7.6"></path></svg></span>
                  </span>
                </button>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 2px">
                <span style="font-size: 14px; line-height: 1.25; font-weight: 600; color: {{f.titleColor}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{f.title}}</span>
                <span style="font-size: 12.5px; line-height: 1.3; color: {{t.dim}}">{{f.year}}</span>
                <sc-if value="{{f.hasProv}}" hint-placeholder-val="{{ true }}">
                  <span role="list" aria-label="{{f.provLabel}}" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px">
                    <sc-for list="{{f.prov}}" as="pv" hint-placeholder-count="2">
                      <span role="listitem" aria-label="{{pv.name}}" style="width: 22px; height: 22px; border-radius: 6px; background: {{t.raised}}; box-shadow: inset 0 0 0 1px {{t.line}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center; font-size: 8.5px; font-weight: 700; letter-spacing: 0.02em">{{pv.abbr}}</span>
                    </sc-for>
                  </span>
                </sc-if>
              </div>
            </div>
          </sc-for>
        </div>
      </section>
    </main>
    
    <div style="flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 6px">
      <sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
        <div role="group" aria-label="Who it's for" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{visOpts}}" as="v" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="min-height: 48px; border: 0; border-radius: 14px; background: {{v.bg}}; color: {{v.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px">
              <span style="font-size: 14px; font-weight: 600">{{v.label}}</span>
              <span style="font-size: 11.5px; font-weight: 500; color: {{v.hintColor}}">{{v.hint}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>
      <div style="position: relative">
        <label for="newItem" class="sr">Add a film</label>
        <input id="newItem" type="text" value="{{text}}" onChange="{{onText}}" placeholder="Add a film…" autocomplete="off" style="box-sizing: border-box; width: 100%; height: 52px; border-radius: 26px; border: 1.5px solid {{fieldBorder}}; background: {{t.surface}}; color: {{t.text}}; padding: 0 58px 0 20px; font-size: 16px; outline: none" />
        <button type="button" aria-label="Add" onClick="{{add}}" style="position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border: 0; border-radius: 20px; background: {{addBg}}; color: {{addFg}}; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </div>
    
    <nav aria-label="Kinds" style="flex-shrink: 0; display: flex; padding: 2px 6px 14px">
        <a href="Main.dc.html" style="flex: 1 1 0; min-width: 0; min-height: 56px; border: 0; background: transparent; color: {{t.dim}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 0"><span style="width: 54px; height: 30px; border-radius: 15px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l1.7 5.1a2 2 0 0 0 1.3 1.3l5.1 1.7-5.1 1.7a2 2 0 0 0-1.3 1.3L12 19.8l-1.7-5.2a2 2 0 0 0-1.3-1.3L3.9 11.6l5.1-1.7a2 2 0 0 0 1.3-1.3z"></path></svg></span>
          <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap">Activities <span style="font-weight: 500; opacity: 0.7; font-variant-numeric: tabular-nums">5</span></span></a><button type="button" aria-current="page" style="flex: 1 1 0; min-width: 0; min-height: 56px; border: 0; background: transparent; color: {{t.accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 0"><span style="width: 54px; height: 30px; border-radius: 15px; background: {{t.accentTint}}; display: flex; align-items: center; justify-content: center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="4.8" width="17.6" height="14.4" rx="2.4"></rect><path d="M7.4 4.8v14.4M16.6 4.8v14.4"></path><g fill="currentColor" stroke="none"><rect x="4.6" y="7.4" width="1.6" height="1.6" rx=".4"></rect><rect x="4.6" y="11.2" width="1.6" height="1.6" rx=".4"></rect><rect x="4.6" y="15" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="7.4" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="11.2" width="1.6" height="1.6" rx=".4"></rect><rect x="17.8" y="15" width="1.6" height="1.6" rx=".4"></rect></g></svg></span>
          <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap">Films <span style="font-weight: 500; opacity: 0.7; font-variant-numeric: tabular-nums">{{navCount}}</span></span></button><button type="button" style="flex: 1 1 0; min-width: 0; min-height: 56px; border: 0; background: transparent; color: {{t.dim}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 0"><span style="width: 54px; height: 30px; border-radius: 15px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.2" y="7.6" width="17.6" height="11.6" rx="2.4"></rect><path d="M8.4 3.6L12 7.6l3.6-4"></path></svg></span>
          <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap">Shows <span style="font-weight: 500; opacity: 0.7; font-variant-numeric: tabular-nums">5</span></span></button><a href="Places.dc.html" style="flex: 1 1 0; min-width: 0; min-height: 56px; border: 0; background: transparent; color: {{t.dim}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 0"><span style="width: 54px; height: 30px; border-radius: 15px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.8s6.6-5.4 6.6-10.1a6.6 6.6 0 1 0-13.2 0C5.4 15.4 12 20.8 12 20.8z"></path><circle cx="12" cy="10.5" r="2.4"></circle></svg></span>
          <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap">Places <span style="font-weight: 500; opacity: 0.7; font-variant-numeric: tabular-nums">6</span></span></a><button type="button" style="flex: 1 1 0; min-width: 0; min-height: 56px; border: 0; background: transparent; color: {{t.dim}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 4px 0"><span style="width: 54px; height: 30px; border-radius: 15px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.4 10.2h15.2v4.6a4 4 0 0 1-4 4H8.4a4 4 0 0 1-4-4z"></path><path d="M2.9 10.2h18.2"></path><path d="M9 7.4c0-1.1 1-1.5 1-2.6M12.6 7.4c0-1.1 1-1.5 1-2.6"></path></svg></span>
          <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.01em; white-space: nowrap">Recipes <span style="font-weight: 500; opacity: 0.7; font-variant-numeric: tabular-nums">4</span></span></button>
    </nav>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7),
      glass: rgba(mix(bg, card, 0.5), 0.86),
      mapLand: toHex(mix(bg, card, 0.6)),
      mapWater: toHex(mix(bg, [70, 118, 160], 0.3)),
      mapPark: toHex(mix(mix(bg, card, 0.6), sage, 0.13)),
      mapRoad: toHex(mix(bg, ink, 0.1)),
      mapMajor: toHex(mix(bg, ink, 0.18)),
      mapLabel: toHex(mix(bg, ink, 0.5))
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  initText() { return ''; }
  renderVals() {
    var self = this;
    var t = this.theme(this.props.theme ?? 'dusk');
    var st = this.state || {};
    var done = st.done || {};
    
    var text = st.text != null ? st.text : this.initText();
    var vis = st.vis || 'shared';
    var VIS = [
      { id: 'private', label: 'Just me', hint: 'only you' },
      { id: 'shared', label: 'Us', hint: 'you and Linnea' },
      { id: 'public', label: 'Anyone', hint: 'all your people' }
    ];
    var composer = {
      text: text,
      typing: text.length > 0,
      onText: function (e) { self.setState({ text: e.target.value }); },
      fieldBorder: text.length ? t.accent : 'transparent',
      addBg: text.length ? t.accent : t.accentTint,
      addFg: text.length ? t.onAccent : t.accent,
      visOpts: VIS.map(function (v) {
        var on = v.id === vis;
        return { label: v.label, hint: v.hint, pressed: on ? 'true' : 'false',
          bg: on ? t.accentTint : t.surface, fg: on ? t.accent : t.text2, hintColor: on ? t.accent : t.dim,
          pick: function () { self.setState({ vis: v.id }); } };
      })
    };

    // Posters are stand-ins: a tint drawn from each film's palette, not its art.
    // Provider tiles stand in for the TMDB logos, which stay exactly as the app draws them now.
    var theirs = [
      { id: 'f1', title: 'Good Will Hunting', year: '1997', on: [['Prime Video', 'PV'], ['Apple TV', 'TV'], ['Paramount+', 'P+']], poster: 'linear-gradient(165deg, #7A6440 0%, #3B3024 70%, #2A231B 100%)' },
      { id: 'f2', title: 'They Cloned Tyrone', year: '2023', on: [['Netflix', 'NF']], poster: 'linear-gradient(165deg, #D9A43C 0%, #8A5A22 60%, #3A2614 100%)' },
      { id: 'f3', title: 'Dirty Dancing', year: '1987', on: [['YouTube TV', 'YT'], ['Sling TV', 'SL']], poster: 'linear-gradient(165deg, #F2EEEA 0%, #D7CDD2 60%, #9F8FA6 100%)', light: true }
    ];
    var yours = [
      { id: 'f4', title: 'History of concrete', year: '2026', on: [], poster: 'linear-gradient(165deg, #E4E2DC 0%, #BDBAB2 60%, #8C8982 100%)', light: true },
      { id: 'f5', title: 'Back to the future', year: '1985', on: [], poster: 'linear-gradient(165deg, #3E6AA8 0%, #22325A 55%, #2A1A22 100%)' },
      { id: 'f6', title: 'Memento', year: '2000', on: [['Netflix', 'NF'], ['Prime Video', 'PV'], ['Hulu', 'HU'], ['Peacock', 'PC']], poster: 'linear-gradient(165deg, #D3D8DC 0%, #8E989F 60%, #4D565C 100%)', light: true }
    ];
    var nDone = 0;
    function card(f) {
      var d = !!done[f.id];
      if (d) nDone++;
      return {
        title: f.title, year: f.year, poster: f.poster, done: d,
        hasProv: f.on.length > 0, provLabel: 'Streaming on ' + f.on.map(function (p) { return p[0]; }).join(', '),
        prov: f.on.map(function (p) { return { name: p[0], abbr: p[1] }; }),
        glyph: f.light ? 'rgba(40, 30, 40, 0.28)' : 'rgba(255, 255, 255, 0.3)',
        filter: d ? 'grayscale(1)' : 'none',
        titleColor: d ? t.dim : t.text,
        ringBorder: d ? t.sage : 'rgba(255, 255, 255, 0.85)', ringBg: d ? t.sage : 'rgba(20, 14, 20, 0.45)',
        checkColor: d ? t.onSage : '#FFFFFF', checkOpacity: d ? 1 : 0,
        label: (d ? 'Not seen after all: ' : 'Seen it: ') + f.title, pressed: d ? 'true' : 'false',
        toggle: function () { var n = Object.assign({}, done); n[f.id] = !n[f.id]; self.setState({ done: n }); }
      };
    }
    var theirCards = theirs.map(card);
    var theirDone = nDone;
    var yourCards = yours.map(card);
    var yourDone = nDone - theirDone;
    return Object.assign({
      t: t, theirs: theirCards, yours: yourCards,
      theirsCount: 3 - theirDone, yoursCount: 5 - yourDone,
      openCount: 8 - nDone, navCount: 8 - nDone, doneCount: 2 + nDone,
      add: function () { self.setState({ text: '' }); }
    }, composer);
  }
}
</script>
</body>
</html>
