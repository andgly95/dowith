<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Do With: answering today’s question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C0A0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
input::placeholder,textarea::placeholder{color:#9A90A2;opacity:1}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; top: 0; left: 0; right: 0; padding: 14px 20px 0">
    <div style="display: flex; justify-content: space-between; align-items: center; height: 44px; margin-left: -8px; color: {{t.text}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg><span style="display: flex; color: {{t.dim}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 5.2c0 3.3 2.2 5.8 5 5.8s5-2.5 5-5.8c-1.4.9-2.7.9-3.6 0-.6-.6-1-1.5-1.4-2.7-.4 1.2-.8 2.1-1.4 2.7-.9.9-2.2.9-3.6 0z"/><path d="M9.8 6.9c.6.8 1.4 1.2 2.2 1.2s1.6-.4 2.2-1.2"/><path d="M12 11v10"/><path d="M12 16.2c-1.9-.2-3.5-1.3-4.1-3.2 2 0 3.5 1 4.1 3.2z"/><path d="M12 18.6c1.9-.2 3.5-1.3 4.1-3.2-2 0-3.5 1-4.1 3.2z"/></svg></span></div>
    <div style="margin-top: 14px; font-size: 13px; color: {{t.dim}}">To do with</div>
    <div style="font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 34px; line-height: 1.1; font-weight: 600">Sam</div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: {{t.scrim}}"></div>
  <section role="dialog" aria-modal="true" aria-label="Today’s question" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; box-sizing: border-box; border-radius: 28px 28px 0 0; background: {{t.sheet}}; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.35); padding: 8px 16px 26px; display: flex; flex-direction: column; gap: 18px">
    <div aria-hidden="true" style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: {{t.line}}"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: -4px">
      <div style="display: flex; flex-direction: column; gap: 3px; padding: 4px 0 0 4px">
        <h2 style="margin: 0; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 26px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em">Today’s question</h2>
        <span style="font-size: 13.5px; color: {{t.dim}}">Wednesday, Nov 18 · Romance</span>
      </div>
      <a href="DQ-List.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: {{t.raised}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></a>
    </div>
    <p style="margin: 0; padding: 0 4px; font-family: 'Iowan Old Style', 'Source Serif 4', Palatino, 'Book Antiqua', Georgia, serif; font-size: 24px; line-height: 1.28; font-weight: 600; letter-spacing: -0.01em">What’s something you’ve never done that you’d want to try with me?</p>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="dqA" style="padding: 0 4px; font-size: 14px; font-weight: 600; color: {{t.text2}}">Your answer</label>
      <textarea id="dqA" rows="4" value="{{a}}" onChange="{{onA}}" placeholder="Say it how you’d say it" style="box-sizing: border-box; width: 100%; min-height: 128px; resize: none; border-radius: 18px; border: 1.5px solid {{fieldLine}}; background: {{t.surface}}; color: {{t.text}}; padding: 14px 16px; font-size: 16.5px; line-height: 1.45; outline: none"></textarea>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 16px; border-radius: 20px; background: {{t.surface}}">
        <div style="display: flex; align-items: center; gap: 10px">
          <span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{faceBg}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">S</span>
          <span style="flex: 1; font-size: 15px; font-weight: 600">Sam’s answer</span>
          <span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: {{t.dim}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Locked</span>
        </div>
        <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px; padding-left: 38px"><span style="display: block; height: 11px; width: 92%; border-radius: 6px; background: {{t.raised}}"></span><span style="display: block; height: 11px; width: 70%; border-radius: 6px; background: {{t.raised}}"></span></div>
        <span style="padding-left: 38px; font-size: 13px; line-height: 1.4; color: {{t.dim}}">You’ll see it the moment you answer.</span>
      </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}"><a href="DQ-Revealed.dc.html" style="min-height: 54px; border-radius: 27px; background: {{t.accent}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">Answer and see Sam’s</a></sc-if>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><button type="button" aria-disabled="true" style="min-height: 54px; border: 0; border-radius: 27px; background: {{t.raised}}; color: {{t.dim}}; font-size: 16px; font-weight: 600">Answer and see Sam’s</button></sc-if>
      <span style="text-align: center; font-size: 13px; color: {{t.dim}}">Sam’s already in, so yours is final once you send it.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "default": "dusk", "options": ["dusk", "forest"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  theme(key) {
    var P = {
      dusk: { bg: '#17131A', card: '#211C26', card2: '#2B2430', line: '#332B3A', ink: '#F4EEE9', ink2: '#CBBFC6', dim: '#948A9C', faint: '#6B6274', accent: '#F2845C', sage: '#8FB9A8', warn: '#E0714F', onAccent: '#2A1206', onSage: '#10251D', rose: '#E0708A' },
      forest: { bg: '#111A15', card: '#18241D', card2: '#213027', line: '#2D3F34', ink: '#EDF1E7', ink2: '#C6D1C4', dim: '#93A69A', faint: '#627569', accent: '#E8A658', sage: '#93CFA0', warn: '#E07A5F', onAccent: '#2A1705', onSage: '#0D2416', rose: '#E08A92' }
    };
    var p = P[key] || P.dusk;
    function hex(h) { var n = parseInt(String(h).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    function toHex(c) { return '#' + c.map(function (v) { var s = Math.round(Math.max(0, Math.min(255, v))).toString(16); return s.length < 2 ? '0' + s : s; }).join('').toUpperCase(); }
    function mix(a, b, w) { return [a[0] + (b[0] - a[0]) * w, a[1] + (b[1] - a[1]) * w, a[2] + (b[2] - a[2]) * w]; }
    function lum(c) { var r = c.map(function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r[0] + 0.7152 * r[1] + 0.0722 * r[2]; }
    function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
    function ensure(c, ref, min, toward) { var x = c; for (var i = 0; i < 20 && ratio(x, ref) < min; i++) x = mix(x, toward, 0.06); return x; }
    function rgba(c, a) { return 'rgba(' + Math.round(c[0]) + ', ' + Math.round(c[1]) + ', ' + Math.round(c[2]) + ', ' + a + ')'; }
    var bg = hex(p.bg), card = hex(p.card), card2 = hex(p.card2), ink = hex(p.ink), acc = hex(p.accent), sage = hex(p.sage);
    var dim = ensure(hex(p.dim), card2, 4.5, ink);
    return {
      key: p === P.forest ? 'forest' : 'dusk',
      bg: p.bg, surface: p.card, raised: p.card2, line: p.line,
      sheet: toHex(mix(bg, card, 0.5)),
      text: p.ink, text2: p.ink2, dim: toHex(dim), faint: p.faint,
      accent: p.accent, accentTint: rgba(acc, 0.16), onAccent: p.onAccent,
      sage: p.sage, sageTint: rgba(sage, 0.16), onSage: p.onSage,
      warn: p.warn, rose: p.rose,
      scrim: rgba(mix(bg, [0, 0, 0], 0.5), 0.7),
      glass: rgba(mix(bg, card, 0.5), 0.86),
      mapLand: toHex(mix(bg, card, 0.6)),
      mapWater: toHex(mix(bg, [70, 118, 160], 0.3)),
      mapPark: toHex(mix(mix(bg, card, 0.6), sage, 0.13)),
      mapRoad: toHex(mix(bg, ink, 0.1)),
      mapMajor: toHex(mix(bg, ink, 0.18)),
      mapLabel: toHex(mix(bg, ink, 0.5))
    };
  }
  lead(title) {
    var m = /^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:️|⃣|\p{Emoji_Modifier}|\p{Regional_Indicator}|‍\p{Extended_Pictographic})*)\s*/u.exec(title);
    if (!m) return { emoji: '', rest: title };
    return { emoji: m[1], rest: title.slice(m[0].length) };
  }

  hx(h) { h = String(h).replace('#', ''); var n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  hex(c) { return '#' + c.map(function (v) { v = Math.round(Math.max(0, Math.min(255, v))).toString(16); return v.length < 2 ? '0' + v : v; }).join('').toUpperCase(); }
  mixc(a, b, w) { var x = this.hx(a), y = this.hx(b); return this.hex([x[0] + (y[0] - x[0]) * w, x[1] + (y[1] - x[1]) * w, x[2] + (y[2] - x[2]) * w]); }
  rgba(h, a) { var c = this.hx(h); return 'rgba(' + c[0] + ', ' + c[1] + ', ' + c[2] + ', ' + a + ')'; }
  dq() {
    var t = this.theme(this.props.theme ?? 'dusk');
    return {
      t: t, faceBg: this.mixc(t.raised, t.text, 0.16),
      cardTop: this.mixc(t.surface, t.accent, 0.13), cardLine: this.rgba(t.accent, 0.22),
      glow: this.rgba(t.accent, 0.28), flameBg: this.rgba(t.accent, 0.16),
      roseTint: this.rgba(t.rose, 0.16), roseLine: this.rgba(t.rose, 0.4), roseInk: this.mixc(t.rose, t.text, 0.25),
      roseTop: this.mixc(t.surface, t.rose, 0.12),
      roomTop: this.mixc(t.sheet, t.rose, 0.12), roomSheet: this.mixc(t.sheet, t.rose, 0.04),
      roomCard: this.mixc(t.surface, t.rose, 0.07), onRose: this.mixc(t.bg, '#000000', 0.35)
    };
  }

  renderVals() {
    var self = this;
    var d = this.dq();
    var t = d.t;
    var st = this.state || {};
    var a = st.a != null ? st.a : 'Night swimming somewhere warm. Just us and the dark.';
    var ok = a.trim().length > 0;
    return Object.assign(d, {
      a: a, onA: function (e) { self.setState({ a: e.target.value }); },
      ready: ok, empty: !ok, fieldLine: ok ? t.accent : 'transparent'
    });
  }
}
</script>
</body>
</html>
